name: Hata bildirimi / Bug report
description: QRPeek'te karşılaştığınız bir sorunu bildirin. / Report a problem you ran into with QRPeek.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **⚠️ QR içeriğini yapıştırmayın / Don't paste QR contents.** QR kodlarında şifre, 2FA anahtarı veya kişisel bilgi olabilir. Kodun yalnızca **türünü** yazmanız yeterli (bağlantı, Wi-Fi, e-Fatura…). Örnek gerekiyorsa içinde gizli bilgi olmayan bir test kodu ekleyin.
        QR codes can contain passwords, 2FA keys or personal data. Naming the **kind** of code is enough (link, Wi-Fi, e-invoice…). If an example is needed, attach a test code with nothing secret in it.

        Güvenlik açıkları için issue açmayın; [SECURITY.md](https://github.com/umitkrkmz/qrpeek/blob/master/SECURITY.md)'ye bakın. / For security issues, don't open an issue; see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: Ne oldu? / What happened?
      description: Ne yaptınız, ne bekliyordunuz, ne oldu? / What did you do, what did you expect, what happened?
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: Hangi özellik? / Which feature?
      options:
        - Ekranı tara (kısayol) / Scan screen (shortcut)
        - Alan seç / Select area
        - Görselden oku / From image
        - Sonuç kartı (bağlantı, Wi-Fi, 2FA, e-Fatura…) / Result card
        - Telefona gönder / Send to phone
        - QR oluştur / Create QR
        - Ekranı izleme modu / Watch mode
        - Ayarlar, kısayollar, başlangıç / Settings, shortcuts, startup
        - Diğer / Other
    validations:
      required: true

  - type: input
    id: code-kind
    attributes:
      label: Kodun türü (varsa) / Kind of code (if any)
      placeholder: "bağlantı / link, Wi-Fi, e-Fatura, metin / text…"

  - type: input
    id: version
    attributes:
      label: QRPeek sürümü / QRPeek version
      description: Ayarlar → Hakkında. / Settings → About.
      placeholder: "0.3.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Kurulum / Install
      options:
        - Microsoft Store
        - GitHub (QRPeek-portable.zip)
        - Kaynaktan derleme / Built from source
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows sürümü / Windows version
      description: Ayarlar → Sistem → Hakkında, ör. "Windows 11 24H2". / Settings → System → About.
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: monitors
    attributes:
      label: Monitörler ve ölçekleme / Monitors and scaling
      description: Çoklu monitör henüz test edilmedi; bu bilgi çok işe yarar. / Multi-monitor setups are untested yet, so this helps a lot.
      placeholder: "1 monitör %100 / 2 monitors: 100% + 150%"
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: Hata günlüğü (varsa) / Error log (if any)
      description: |
        `%LOCALAPPDATA%\QRPeek\error.log` dosyasının son kısmı. Yapıştırmadan önce içinde kişisel bilgi olmadığına bakın.
        The last part of `%LOCALAPPDATA%\QRPeek\error.log`. Check it for personal data before pasting.
      render: text

  - type: textarea
    id: screenshot
    attributes:
      label: Ekran görüntüsü (isteğe bağlı) / Screenshot (optional)
      description: Gizli bilgi içermediğinden emin olun. / Make sure it shows nothing private.
